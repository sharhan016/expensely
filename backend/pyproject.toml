[project]
name = "expense-analyzer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "itsdangerous>=2.2,<3",
  "pdfplumber>=0.11,<1",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"] # FastAPI dependencies are intentionally declared as defaults.
